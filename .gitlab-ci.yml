image: sgkens/phellams-automator:${AUTOMATOR_VERSION}

stages:
  - test

before_script:
  - apt-get update -qq
  - apt-get install -y -qq gi
  - pwsh -NoLogo -NoProfile -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force; Install-Module PSScriptAnalyzer -Scope CurrentUser -Force"

pester:
  stage: test
  script:
    - pwsh -NoLogo -NoProfile -File ./tools/Invoke-CI.ps1
  artifacts:
    when: always
    reports:
      junit: TestResults.xml
    paths:
      - TestResults.xml
      - coverage.xml

analyzer:
  stage: test
  script:
    - pwsh -NoLogo -NoProfile -Command '$findings = @(Invoke-ScriptAnalyzer . -Recurse -Severity Error); if ($findings.Count) { $findings | Format-Table -Wrap; exit 1 }'
