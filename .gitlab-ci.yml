image: sgkens/phellams-automator:${AUTOMATOR_VERSION}

stages:
  - test
  - coverage

pester:
  stage: test
  script:
    - echo "🟣 Running Pester Test Suite..."
    - pwsh -NoLogo -NoProfile -File ./tools/Invoke-CI.ps1
  artifacts:
    when: always
    reports:
      junit: TestResults.xml
    paths:
      - TestResults.xml
      - coverage.xml

analyzer:
  stage: test
  script:
    - echo "🟣 Running Scipt Analyzer..."
    - pwsh -NoLogo -NoProfile -Command '$findings = @(Invoke-ScriptAnalyzer . -Recurse -Severity Error); if ($findings.Count) { $findings | Format-Table -Wrap; exit 1 }'

# ------------------------------------------------------
# Coverage stage
# ------------------------------------------------------
coverage:
  stage: coverage
  needs:
    - job: pester
      artifacts: true
  script:
    - echo "🟣 Collecting test coverage..."
    - command -v codecov
    - codecov --verbose upload-process --disable-search --fail-on-error -t "$CODECOV_TOKEN" -n "gx-${CI_COMMIT_SHORT_SHA}" -F unit -f coverage/lcov.info
  allow_failure: false
